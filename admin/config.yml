backend:
  name: github
  repo: Marcelo-Matheus-Almeida/cardapiomatriz
  branch: main
  base_url: https://api.netlify.com

publish_mode: simple
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: cardapio
    label: Cardápio semanal
    files:
      - name: semana
        label: Semana atual
        file: data/cardapio.json
        format: json
        fields:
          - label: Semana exibida
            name: weekLabel
            widget: string
            hint: Exemplo- Semana de 05/10
          - label: Validade do cardápio
            name: validUntil
            widget: datetime
            format: "YYYY-MM-DDTHH:mm:ssZ"
            date_format: "DD/MM/YYYY"
            time_format: "HH:mm"
            hint: Inclua a sexta-feira e escolha 23:59 no horário de Brasília.
          - label: Dias
            name: days
            widget: list
            min: 5
            max: 5
            fields:
              - label: Chave do dia
                name: key
                widget: select
                options: [seg, ter, qua, qui, sex]
              - label: Nome do dia
                name: name
                widget: string
              - label: Emoji do dia
                name: emoji
                widget: string
              - label: Número do dia
                name: number
                widget: number
                value_type: int
              - label: Categorias
                name: sections
                widget: list
                min: 5
                max: 5
                fields:
                  - label: Tipo
                    name: type
                    widget: select
                    options: [prato, acomp, salada, suco, sobremesa]
                  - label: Categoria
                    name: title
                    widget: string
                  - label: Emoji
                    name: emoji
                    widget: string
                  - label: Itens
                    name: items
                    widget: list
                    field:
                      label: Item
                      name: item
                      widget: string
                  - label: Destacar como prato principal
                    name: main
                    widget: boolean
                    default: true
